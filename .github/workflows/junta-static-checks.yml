name: Junta Comunal - Static Site Checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/junta-static-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required site files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
      - name: Check JavaScript syntax
        run: node --check app.js
